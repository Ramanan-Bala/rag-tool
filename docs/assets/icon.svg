<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="repo-rag icon">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="0.55" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#9333EA"/>
    </linearGradient>
    <linearGradient id="sheen" x1="40" y1="24" x2="150" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#sheen)"/>

  <!-- retrieval graph (vectors / semantic nodes) inside the lens -->
  <g stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.6">
    <line x1="84" y1="88" x2="126" y2="96"/>
    <line x1="126" y1="96" x2="98" y2="126"/>
    <line x1="84" y1="88" x2="98" y2="126"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="84" cy="88" r="7"/>
    <circle cx="126" cy="96" r="7"/>
    <circle cx="98" cy="126" r="7"/>
  </g>

  <!-- magnifying glass -->
  <circle cx="104" cy="104" r="52" stroke="#FFFFFF" stroke-width="14" fill="none"/>
  <line x1="144" y1="144" x2="198" y2="198" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>
  <line x1="144" y1="144" x2="198" y2="198" stroke="#C4B5FD" stroke-width="8" stroke-linecap="round" stroke-opacity="0.8"/>
</svg>
